<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copilot Agent — Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #fff;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="number"]:focus {
      border-color: #6366f1;
    }
    .hint {
      font-size: 12px;
      color: #475569;
      margin-top: 6px;
    }
    button {
      margin-top: 24px;
      width: 100%;
      padding: 11px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #4f46e5; }
    .status {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      color: #4ade80;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .status.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚙️ Copilot Agent Options</h1>
    <p class="subtitle">Configure connection settings for the Python CLI agent.</p>

    <label for="wsPort">WebSocket Port</label>
    <input
      type="number"
      id="wsPort"
      min="1024"
      max="65535"
      placeholder="8765"
    />
    <p class="hint">
      Must match <code>websocket_port</code> in your <code>config.json</code>.
      Default: <strong>8765</strong>.
    </p>

    <button id="saveBtn">Save Settings</button>
    <div class="status" id="status">✓ Settings saved — reconnecting…</div>
  </div>

  <script src="options.js"></script>
</body>
</html>
